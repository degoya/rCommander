# Update proposals for the public repository (RC-100-30).
#
# The public repository is an export, refreshed at every release as one fresh commit, so a
# Dependabot pull request is never merged there: like every pull request it is a proposal the
# maintainer applies by hand in the development repository (CONTRIBUTING.md), and its CI run is
# what says whether the update is safe to apply. Hence few, grouped pull requests on a slow
# schedule rather than one per crate. Security updates for alerts are switched on in the
# repository's settings, not here; the `security` group only bundles what they open.
version: 2
updates:
  # The workflows' actions: few, small, and each one a line to copy.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One pull request for everything semver-compatible and one for the major versions: a major
  # update is work of its own, while the compatible group is a `cargo update` away and says which
  # crates moved. The plugins are workspace members, so the root covers them.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-compatible:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
