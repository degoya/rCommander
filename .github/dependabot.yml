# Update proposals for the public repository (RC-100-30).
#
# The public repository is an export, refreshed at every release as one fresh commit, so a
# Dependabot pull request is never merged there: like every pull request it is a proposal the
# maintainer applies by hand in the development repository (CONTRIBUTING.md), and its CI run is
# what says whether the update is safe to apply. Hence few, grouped pull requests on a slow
# schedule rather than one per crate. Security updates for alerts are switched on in the
# repository's settings, not here; the `security` group only bundles what they open.
version: 2
updates:
  # The workflows' actions: few, small, and each one a line to copy. "/" is .github/workflows
  # alone; the composite actions' own pins are read only from their directories.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # One pull request for everything semver-compatible and one for the major versions: a major
  # update is work of its own, while the compatible group is a `cargo update` away and says which
  # crates moved. The plugins are workspace members, so the root covers them.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-compatible:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    # Pinned to the version another dependency brings, so an update alone would put a second copy
    # into the tree (public pull requests 20 and 21): wat and wit-* follow Wasmtime's
    # wasm-encoder and wasmparser (RC-100-57), pulldown-cmark and x11rb follow iced and winit
    # (RC-110-13, RC-110-14). They move by hand with that upgrade; remove the entry then.
    ignore:
      - dependency-name: wat
      - dependency-name: wit-component
      - dependency-name: wit-parser
      - dependency-name: pulldown-cmark
      - dependency-name: x11rb
