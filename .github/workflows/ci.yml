name: CI

# The checks of every push and pull request on GitHub (RC-100-31, adapted from rDownloader's
# ci.yml): what scripts/check.sh --preflight checks without a compiler, and clippy with
# -D warnings and every test on each system rCommander builds for; on macOS also the app bundle
# of both architectures (RC-100-44). scripts/check.sh stays the local gate; this is the same
# gate on the machines a workstation does not have.
on:
  # Branches only: a release tag has release.yml.
  push:
    branches: ["**"]
  pull_request:
  # A re-check of one fix need not wait for platforms it cannot affect: dispatched by hand, the
  # `rust` job takes only the runner images named here, and `macos-package` runs only with a
  # macOS image among them.
  #   gh workflow run ci.yml --ref ci/<branch> -f platforms='["windows-2025"]'
  workflow_dispatch:
    inputs:
      platforms:
        description: JSON list of runner images for the rust job
        required: false
        default: '["ubuntu-24.04","ubuntu-24.04-arm","windows-2025","macos-15","macos-15-intel"]'

# Nothing by default; every job names what it needs, which is reading the tree. No job here sees
# a secret: a run on ci/* or a pull request signs nothing (RC-100-31).
permissions: {}

# A newer push to the same branch makes the running one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental state is dead weight in a one-off build.
  CARGO_INCREMENTAL: 0
  # A runner runs one job: the build lock and the memory gate of scripts/lib/lock.sh are for a
  # shared workstation.
  RC_NO_LOCK: 1
  RC_MIN_FREE_MB: 0
  # The default list, also for push and pull_request, which have no inputs.
  PLATFORMS: ${{ inputs.platforms || '["ubuntu-24.04","ubuntu-24.04-arm","windows-2025","macos-15","macos-15-intel"]' }}

# Runner images are named, not `-latest`: a `-latest` label moves under a release without a
# commit. Actions are pinned to a commit with the release as a comment - a tag can be moved, a
# commit cannot (rDownloader's pins).

jobs:
  # What needs no compiler: scripts/check.sh --preflight with shellcheck and gitleaks at their
  # pins, and cargo-deny against the current advisories.
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The runner images of this run
        id: platforms
        shell: bash
        run: |
          python3 -I -c 'import json, sys; images = json.loads(sys.argv[1]); assert isinstance(images, list) and images and all(isinstance(image, str) for image in images)' "${PLATFORMS}" \
            || { echo "::error::platforms is no JSON list of runner images: ${PLATFORMS}"; exit 1; }
          echo "platforms=${PLATFORMS}" >> "${GITHUB_OUTPUT}"
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
      # licenses.sh --offline reads the dependencies' manifests from the registry cache.
      - run: cargo fetch --locked
      - name: Install shellcheck and gitleaks
        run: scripts/ci-tools.sh linters
      # Online here, against today's advisories; the preflight's own `cargo deny --offline`
      # skips without cargo-deny installed.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: scripts/check.sh --preflight
        env:
          RC_CHECK_LOGS: ${{ runner.temp }}/check
        run: scripts/check.sh --preflight
      - name: Upload the check logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-logs
          path: ${{ runner.temp }}/check
          retention-days: 14

  # Clippy (-D warnings) and every test, natively on each runner image: Linux x64 and arm64,
  # Windows with MSVC (the target the release cross-builds from WSL), macOS on Apple Silicon and
  # on Intel. Windows lints the libraries once more alone, as scripts/check.sh --windows does.
  # Linux x64 also lints the plugins for wasm32 and builds them unsigned, with their conformance
  # check (scripts/build-plugins.sh --development).
  rust:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.checks.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # A hang is cut off rather than left running for six hours.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        if: runner.os != 'Windows'
        uses: ./.github/actions/free-runner-disk
      - uses: ./.github/actions/rust-tests-cache
        with:
          components: clippy
          save: true
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # `--all-targets` switches on the dev-dependencies' features in every library; the
      # libraries as they ship are linted only by this second run.
      - name: Clippy, the libraries as they ship
        if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace -- -D warnings
      # Two build jobs keep the links' memory down; the macOS runners have 7 GB.
      - name: Tests
        env:
          CARGO_BUILD_JOBS: 2
        run: cargo nextest run --locked --workspace --no-fail-fast -P ci
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14
      # What the runner had when a step failed: a linker that ran out of disk or memory says so
      # just under "linking with cc failed".
      - name: Disk and memory after a failure
        if: failure()
        shell: bash
        run: |
          df -h . || true
          du -sh target 2> /dev/null || true
          free -m 2> /dev/null || vm_stat 2> /dev/null || true

  # The plugins' guest code for wasm32 - clippy over them and the crates they share, as
  # scripts/check.sh --rust does - and the bundled plugins built unsigned with their conformance
  # check (scripts/build-plugins.sh --development), kept for `macos-package`.
  plugins:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      - uses: ./.github/actions/rust-tests-cache
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - name: Clippy for wasm32, the plugins and the crates they share
        shell: bash
        run: |
          packages=(-p rc-plugin-types -p rc-plugin-text -p rc-plugin-api)
          for manifest in plugins/*/Cargo.toml; do
            packages+=(-p "$(sed -n '/^name = /{s/^name = "\(.*\)"/\1/p;q}' "${manifest}")")
          done
          cargo clippy --locked --target wasm32-unknown-unknown "${packages[@]}" -- -D warnings
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: wasm-tools@1.261.0
      - name: The plugins, unsigned, with their conformance check
        run: scripts/build-plugins.sh --development
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-plugins
          path: artifacts/dev-plugins/*.rcplug
          if-no-files-found: error
          retention-days: 3

  # rCommander.app for both architectures, as release.yml builds it, with `plugins`' unsigned
  # packages (RC-100-44): the bundle's layout, Info.plist, the ad hoc signature and, on Apple Silicon, a
  # start of the binary. x86_64 is cross-compiled on the Apple Silicon runner. The zip stays a
  # week as an artifact of the run.
  macos-package:
    needs: [checks, plugins]
    if: contains(needs.checks.outputs.platforms, 'macos-')
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      # The runner has three cores and 7 GB.
      RC_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.arch }}-apple-darwin
      # Into the ignored artifacts/, so the tree stays clean and VERSION.txt names the commit.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-plugins
          path: artifacts/dev-plugins
      - name: Package rCommander.app
        run: scripts/package-macos.sh --profile release-test --arch ${{ matrix.arch }} --plugins artifacts/dev-plugins
      - name: Start the packaged binary
        if: matrix.arch == 'aarch64'
        shell: bash
        run: |
          unpacked="${RUNNER_TEMP}/unpacked"
          mkdir -p "${unpacked}"
          ditto -x -k artifacts/macos/rcommander-*-macos-aarch64.zip "${unpacked}"
          codesign --verify --deep --strict "${unpacked}/rCommander.app"
          "${unpacked}/rCommander.app/Contents/MacOS/rcommander" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: artifacts/macos/*.zip
          if-no-files-found: error
          retention-days: 7
