name: Fuzz

# The fuzz targets of fuzz/ run regularly (RC-110-68): scripts/fuzz.sh on GitHub's runner, every
# target 5 minutes, once a week and by hand. scripts/check.sh --full only builds them, and the
# nightly timer of a workstation (scripts/install-hooks.sh --timer) runs only where it is
# installed. The corpus grows from run to run in the cache `fuzz-corpus-*` and is kept with each
# run as an artifact; a finding fails the run and uploads its reproducer (fuzz/artifacts/), which
# `cargo +<nightly> fuzz run <target> <file> --fuzz-dir fuzz` replays (scripts/fuzz.sh's header).
#
#   gh workflow run fuzz.yml -f seconds=60 -f targets='mcp_request ssh_config'
on:
  schedule:
    # Mondays, 03:17 UTC: off the hour, when GitHub's scheduler is busiest.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: "300"
      targets:
        description: Targets separated by spaces (scripts/fuzz.sh --list); empty for all
        required: false
        default: ""

# Nothing by default; the job reads the tree. No secret is used.
permissions: {}

# One run at a time, and a running one is never cancelled: its corpus is saved at its end.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A runner runs one job: the build lock and the memory gate of scripts/lib/lock.sh are for a
  # shared workstation.
  RC_NO_LOCK: 1
  RC_MIN_FREE_MB: 0

# Runner images are named, actions pinned to a commit with the release as a comment, as in ci.yml.

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # The build (every target with the sanitizer, about half an hour) and every target 5 minutes.
    timeout-minutes: 180
    env:
      RC_FUZZ_DIR: ${{ github.workspace }}/target/fuzz
      SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
      TARGETS: ${{ inputs.targets || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      # The one pin of the nightly and of cargo-fuzz: scripts/lib/tool-versions.sh. RUSTUP_TOOLCHAIN
      # keeps every later cargo on the nightly, so rust-toolchain.toml's stable is never installed.
      - name: The pinned nightly and cargo-fuzz
        id: pins
        shell: bash
        run: |
          source scripts/lib/tool-versions.sh
          echo "nightly=${RC_FUZZ_NIGHTLY}" >> "${GITHUB_OUTPUT}"
          echo "RUSTUP_TOOLCHAIN=${RC_FUZZ_NIGHTLY}" >> "${GITHUB_ENV}"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (branch; the action has no release tags)
        with:
          toolchain: ${{ steps.pins.outputs.nightly }}
      # RC_CARGO_FUZZ_VERSION of scripts/lib/tool-versions.sh (scripts/tests/tool-versions.sh).
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2
      # The newest corpus of an earlier run; a new key per run, so each run saves its own.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: scripts/fuzz.sh
        shell: bash
        env:
          RC_FUZZ_LOGS: ${{ runner.temp }}/fuzz-logs
        run: |
          read -r -a targets <<< "${TARGETS}"
          scripts/fuzz.sh --seconds "${SECONDS_PER_TARGET}" "${targets[@]}"
      # Also after a finding: the corpus a run grew is kept either way.
      - name: Save the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload the corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-corpus
          path: target/fuzz/corpus
          if-no-files-found: warn
          retention-days: 30
      - name: Upload the reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: fuzz/artifacts
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-logs
          path: ${{ runner.temp }}/fuzz-logs
          if-no-files-found: warn
          retention-days: 30
