name: Release

# A version tag builds, packages and publishes rCommander (RC-100-31, RC-100-44, adapted from
# rDownloader's release.yml): the bundled plugins signed once, the packages of every system with
# them - Windows natively with MSVC, Linux natively on x64 and arm64, macOS for Apple Silicon and
# Intel on the Apple Silicon runner - then SHA256SUMS over them, its keyless Sigstore signature,
# the signed update manifests and the GitHub release, whose text is the version's section of
# RELEASE-NOTES.md. The only workflow that reads a secret.
on:
  push:
    tags:
      - "v*.*.*"

# Read-only by default; `publish` names what it writes.
permissions:
  contents: read

# A re-run of a tag waits for the running one instead of racing it to the release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A runner runs one job: the build lock and the memory gate of scripts/lib/lock.sh are for a
  # shared workstation.
  RC_NO_LOCK: 1
  RC_MIN_FREE_MB: 0

# Runner images are named rather than `-latest`, for the reason in ci.yml: here the Ubuntu image
# also sets the glibc floor of the shipped Linux binaries. No Rust cache: a tag's run reads only
# its own caches and the default branch's, and none holds a release build.

jobs:
  # The bundled plugins, signed with the release key, and the packager rc-pack, which `publish`
  # builds the update manifests with. The key is written to a file only this job's runner sees,
  # never echoed, and removed after the build.
  plugins:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The tag is the workspace version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(scripts/set-version.sh)"
          if [[ "v${version}" != "${REF_NAME}" ]]; then
            echo "::error::the tag ${REF_NAME} is not the workspace version ${version} (scripts/set-version.sh)"
            exit 1
          fi
          scripts/set-version.sh --check
      - uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: wasm-tools@1.261.0
      - name: Build and sign the bundled plugins
        shell: bash
        env:
          RCOMMANDER_PLUGIN_SIGNING_KEY: ${{ secrets.RCOMMANDER_PLUGIN_SIGNING_KEY }}
        run: |
          if [[ -z "${RCOMMANDER_PLUGIN_SIGNING_KEY}" ]]; then
            echo "::error::RCOMMANDER_PLUGIN_SIGNING_KEY is not set; a release ships signed plugins only"
            exit 1
          fi
          key="${RUNNER_TEMP}/plugin-signing.pem"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${RCOMMANDER_PLUGIN_SIGNING_KEY}" > "${key}")
          RC_PLUGIN_KEY="${key}" scripts/build-plugins.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugins
          path: artifacts/plugins/*.rcplug
          if-no-files-found: error
          retention-days: 3
      - name: Build the packager
        run: cargo build --locked --release -p rc-update --bin rc-pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packager
          path: target/release/rc-pack
          if-no-files-found: error
          retention-days: 3

  # One package per system and architecture, each from the signed plugins above, downloaded into
  # the ignored artifacts/plugins/ so the tree stays clean and VERSION.txt names the tag's commit.
  # The x86_64 macOS binary is cross-compiled on the Apple Silicon runner: Apple's toolchain
  # builds both, and rDownloader's Intel runner took 53 minutes for the same work.
  packages:
    needs: plugins
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            package: scripts/package-windows.sh
            artifact: windows-x64
          # Both Linux binaries on the same Ubuntu release, so they share the glibc floor.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: scripts/package-linux.sh --arch x64
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: scripts/package-linux.sh --arch arm64
            artifact: linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            package: scripts/package-macos.sh --arch aarch64
            artifact: macos-aarch64
          - os: macos-15
            target: x86_64-apple-darwin
            package: scripts/package-macos.sh --arch x86_64
            artifact: macos-x86_64
    name: package (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugins
          path: artifacts/plugins
      - name: Build and package
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          # The macOS runner has three cores and 7 GB.
          RC_JOBS: ${{ runner.os == 'macOS' && '3' || '4' }}
        run: |
          read -r -a command <<< "${PACKAGE}"
          "${command[@]}" --plugins artifacts/plugins
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.artifact }}
          path: |
            artifacts/windows/*.zip
            artifacts/linux/*.tar.gz
            artifacts/macos/*.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [plugins, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The packager is fetched by its own artifact name, outside release-assets/: out of a merged
      # download any artifact carrying a file named rc-pack could become the program that writes
      # the update manifest (rDownloader's security review).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packager
          path: ${{ runner.temp }}/packager
      - name: Set the packager aside
        shell: bash
        run: |
          mv "${RUNNER_TEMP}/packager/rc-pack" "${RUNNER_TEMP}/rc-pack"
          chmod +x "${RUNNER_TEMP}/rc-pack"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: scripts/release-assets.sh sums release-assets
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the checksums with Sigstore
        shell: bash
        run: |
          cd release-assets
          cosign sign-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json --yes
      # The signed update manifests of this release, from the SHA256SUMS above; signed themselves
      # and therefore not in SHA256SUMS. Without the secret the release carries none
      # (scripts/release-publish.sh warns).
      - name: Build and sign the update manifests
        shell: bash
        env:
          RCOMMANDER_UPDATE_SIGNING_KEY: ${{ secrets.RCOMMANDER_UPDATE_SIGNING_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: RC_PACK="${RUNNER_TEMP}/rc-pack" scripts/release-publish.sh update-manifest release-assets "${REF_NAME}"
      # The `## X.Y.Z` section of RELEASE-NOTES.md, the version's points for users; a beta's own
      # `## X.Y.Z-beta.N` section, else its release's `## X.Y.Z` (the docs gate allows both).
      - name: Write the release text
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          for heading in "## ${version}" "## ${version%%-*}"; do
            awk -v heading="${heading}" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' RELEASE-NOTES.md > "${notes}"
            if grep -q '[^[:space:]]' "${notes}"; then exit 0; fi
          done
          echo "::error::RELEASE-NOTES.md has no section ## ${version} (nor ## ${version%%-*})"
          exit 1
      # A vX.Y.Z-beta.N tag is a pre-release: GitHub's `latest` stays on the newest plain release,
      # where the stable update manifest is found.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
