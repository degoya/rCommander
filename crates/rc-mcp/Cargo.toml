[package]
name = "rc-mcp"
description = "rCommander's MCP server: thin tools over rc-engine commands, over stdio and Streamable HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
# The health probe's challenge: a keyed hash proves the token without sending it (RC-080-12).
blake3.workspace = true
# The times files_set_attributes takes as RFC 3339 (RC-020-06).
chrono.workspace = true
rand.workspace = true
rc-db = { path = "../rc-db" }
rc-engine = { path = "../rc-engine" }
rc-vault = { path = "../rc-vault" }
reqwest.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# A signed viewer package for the plugins tool's tests (RC-100-09).
rc-plugin-host = { path = "../rc-plugin-host", features = ["test-support"] }
# The in-process SSH server for the session tools' tests.
rc-remote = { path = "../rc-remote", features = ["testkit"] }
sqlx.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
