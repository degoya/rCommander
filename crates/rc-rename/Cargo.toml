[package]
name = "rc-rename"
description = "The multi-rename engine: Total Commander masks, preview, conflicts, rename order and undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# `serde` for the modification time of a `RenameSource` an MCP call sends.
chrono = { workspace = true, features = ["serde"] }
# The encodings of a name list read from a file (RC-100-96): BOM, UTF-8, UTF-16, ANSI.
rc-plugin-text.workspace = true
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
# The name keys on macOS (RC-080-70): APFS and HFS+ take a composed and a decomposed umlaut as
# one name, so the keys are NFC. Already in the tree (through `stringprep`), at its version.
unicode-normalization = { version = "0.1.26", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
