# The fuzz targets of RC-080-72: one per parser of data from outside, run by scripts/fuzz.sh with
# cargo-fuzz (libFuzzer, a pinned nightly: scripts/lib/tool-versions.sh). A workspace of its own,
# outside the main one, so the main workspace's stable toolchain and its cargo runs never see
# it. scripts/fuzz.sh copies the main Cargo.lock in before every run (fuzz/Cargo.lock is not
# kept), so the targets fuzz the dependency versions rCommander ships.
#
# The targets call only public functions; one a parser lacked is `#[doc(hidden)] pub` in its
# crate (rc_remote::ftp::parse_listing; rc_mcp::check_arguments and
# rc_engine::import::ssh_config::parse_str, RC-110-68).

[package]
name = "rc-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# The instants of the update manifest and the rename dates; at the main workspace's version.
jiff = { version = "1", default-features = false, features = ["std"] }
libfuzzer-sys = "0.4"
rc-cert = { path = "../crates/rc-cert" }
rc-engine = { path = "../crates/rc-engine" }
rc-mcp = { path = "../crates/rc-mcp" }
rc-plugin-host = { path = "../crates/rc-plugin-host" }
rc-remote = { path = "../crates/rc-remote" }
rc-rename = { path = "../crates/rc-rename" }
rc-term = { path = "../crates/rc-term" }
rc-update = { path = "../crates/rc-update" }
rc-vfs = { path = "../crates/rc-vfs" }
# The stdio transport the MCP target frames its input with, as rc-mcp has it.
rmcp = { version = "3.2", default-features = false, features = ["server"] }
# The update target signs a fuzzed payload as the bytes it arrived as.
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["io-util", "rt"] }

[workspace]
members = ["."]

# Line tables in the fuzz build, so a finding's stack names its lines.
[profile.release]
debug = 1

[[bin]]
name = "archive_listing"
path = "fuzz_targets/archive_listing.rs"
test = false
doc = false
bench = false

