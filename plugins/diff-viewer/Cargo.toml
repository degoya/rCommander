[package]
name = "rc-plugin-diff-viewer"
description = "rCommander's bundled diff and patch viewer plugin: added and removed lines coloured, the files and hunks as a tree"
# The plugin's own version (manifest.toml, CHANGES.md), not the workspace's.
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
# Plugins are MIT, as rDownloader's (docs/plugins.md, "SDK").
license = "MIT"
publish = false

# No dependencies: the logic is plain Rust. The guest binding (src/guest.rs) needs wit-bindgen on
# wasm32 only, against `crates/rc-plugin-api/wit`, so the native build of the workspace - clippy,
# the Windows lint, the tests - neither builds nor links it.
[dependencies]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lib]
# `rlib`, as the JSON viewer: `cargo test` runs the logic natively; the component is linked for
# wasm32 by `scripts/build-plugins.sh` alone, with `cargo rustc --crate-type cdylib`.
crate-type = ["rlib"]

[lints]
workspace = true
