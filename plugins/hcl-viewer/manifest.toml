# rCommander's bundled HCL viewer (RC-100-83). The fields every bundled plugin shares are in
# plugins/metadata.toml; `scripts/build-plugins.sh` writes them into the manifest it packages.
# A failure code starts with the plugin's id (locales/en.json).
plugin_type = "viewer"
# Contract 0.2.0: `settings`, through which `open` reads `encoding`.
api_version = "0.4.0"
id = "01a1aafa-1ce6-783f-b838-664eed7d6ab0"
name = "HCL viewer"
version = "0.1.0"

[match]
# Terraform's configuration and variable files, and HCL itself (Packer, Nomad, Terragrunt,
# Vault policies, `.terraform.lock.hcl`): one grammar, HCL's native syntax. A `.tfvars.json` is
# JSON and stays with the JSON viewer.
extensions = ["tf", "tfvars", "hcl"]
magic = []
# The viewer's text limit (`plugins.viewer_output_limit_mib`, 256 MiB): the text of a larger
# file would be cut anyway.
max_size = 268435456

[viewer]
# Read coloured; the outline of a configuration is not this plugin's (RC-100-83).
outputs = ["highlighted"]

# Nothing granted: the plugin reads the file it is handed and nothing else.
[capabilities]

[metadata]
description = "Shows Terraform and HCL files (.tf, .tfvars, .hcl) coloured like an editor."

# The host's 64 MiB of memory hold the index of at most 16 MiB (INDEX_BUDGET_BYTES in
# src/lib.rs), the 1 MiB windows `open` and `text` read and write through, and one line of at
# most 1 MiB with its text.
[limits]
# `open` reads the whole file once, which for a large file on a slow remote takes a while.
timeout_milliseconds = 60000

# How the file's bytes are read: `auto` takes the encoding of a byte-order mark (UTF-8, UTF-16),
# else UTF-8 when the start of the file is valid UTF-8 - what HCL's specification demands - else
# Windows-1252, for a file saved in the ANSI code page.
[[settings]]
key = "encoding"
type = "choice"
values = ["auto", "utf-8", "utf-16le", "windows-1252"]
default = "auto"
