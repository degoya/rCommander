[package]
name = "rc-plugin-media-viewer"
description = "rCommander's bundled media viewer plugin: duration, codecs and tags of audio and video files, and the EXIF of TIFF, HEIC and camera raw photos"
# The plugin's own version (manifest.toml, CHANGES.md), not the workspace's.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Plugins are MIT, as rDownloader's (docs/plugins.md, "SDK").
license = "MIT"
publish = false

# lofty reads the audio formats and their tags (MIT/Apache-2.0, pure Rust; its default feature,
# ID3v2 frame decompression through flate2, stays on: 0.25.5 does not build without it);
# the video containers (ISO-BMFF, Matroska) have readers of their own here; kamadak-exif reads the
# EXIF of TIFF, HEIC and raw files. The guest binding (src/guest.rs) needs wit-bindgen on wasm32
# only, against `crates/rc-plugin-api/wit`.
[dependencies]
kamadak-exif.workspace = true
lofty = "0.25"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lib]
# `rlib`, as the other bundled viewers: `cargo test` runs the logic natively; the component is
# linked for wasm32 by `scripts/build-plugins.sh` alone, with `cargo rustc --crate-type cdylib`.
crate-type = ["rlib"]

[lints]
workspace = true
