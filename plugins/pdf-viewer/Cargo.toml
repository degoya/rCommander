[package]
name = "rc-plugin-pdf-viewer"
description = "rCommander's bundled PDF viewer plugin: the text of a PDF page by page and its document information"
# The plugin's own version (manifest.toml, CHANGES.md), not the workspace's.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Plugins are MIT, as rDownloader's (docs/plugins.md, "SDK"). hayro is MIT OR Apache-2.0; its
# bundled standard fonts (hayro-font, `embed-fonts`) are PDFium's Foxit fonts, BSD-3-Clause.
license = "MIT"
publish = false

# hayro-interpret 0.9 (pure Rust, no getrandom, no C code: RC-100-99 stage 0) parses the document
# (hayro-syntax, re-exported) and runs its content streams; its default features embed the
# standard fonts and CMaps a document may name without embedding them. kurbo and hayro-cmap are
# taken through its re-exports. Note: hayro-interpret turns on hayro-syntax's `unsafe` feature,
# which brings flate2 with `zlib-rs`; in a build of the whole workspace that backend is unified
# into every flate2 user. The guest binding (src/guest.rs) needs wit-bindgen on wasm32 only,
# against `crates/rc-plugin-api/wit`.
[dependencies]
hayro-interpret = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lib]
# `rlib`, as the other bundled viewers: `cargo test` runs the logic natively; the component is
# linked for wasm32 by `scripts/build-plugins.sh` alone, with `cargo rustc --crate-type cdylib`.
crate-type = ["rlib"]

[lints]
workspace = true
