[package]
name = "rc-plugin-powershell-viewer"
description = "rCommander's bundled PowerShell viewer plugin: .ps1, .psm1 and .psd1 coloured, for files of any size"
# The plugin's own version (manifest.toml, CHANGES.md), not the workspace's.
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
# Plugins are MIT, as rDownloader's (docs/plugins.md, "SDK").
license = "MIT"
publish = false

# One dependency: `rc-plugin-text`, the encodings every text viewer shares (RC-100-22). The guest
# binding (src/guest.rs) needs wit-bindgen on wasm32 only, against `crates/rc-plugin-api/wit`, so
# the native build of the workspace - clippy, the Windows lint, the tests - neither builds nor
# links it.
[dependencies]
rc-plugin-text.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen.workspace = true

[lib]
# `rlib`, as the JSON viewer: `cargo test` runs the logic natively; the component is linked for
# wasm32 by `scripts/build-plugins.sh` alone, with `cargo rustc --crate-type cdylib`.
crate-type = ["rlib"]

[lints]
workspace = true
