# rCommander's bundled Python viewer (RC-100-74). The fields every bundled plugin shares are in
# plugins/metadata.toml; `scripts/build-plugins.sh` writes them into the manifest it packages.
# A failure code starts with the plugin's id (locales/en.json).
plugin_type = "viewer"
# Contract 0.2.0: `settings`, through which `open` reads `encoding`.
api_version = "0.6.0"
id = "01a19b54-2242-7948-bcb3-b578803a0fcc"
name = "Python viewer"
version = "0.1.2"

[match]
# Scripts, scripts without a console window, and type stubs.
extensions = ["py", "pyw", "pyi"]
# A script without an extension, by its shebang: `#!` alone, since the interpreter's path varies
# (`/usr/bin/python3`, `/usr/bin/env python`, `/opt/.../python3.12`). `probe` then reads the whole
# first line and declines one without `python` in it, which hands the file to the next viewer -
# a shell script keeps the shell viewer (rCommander asks the plugins whose extension matches
# before those whose magic does, RC-100-27).
magic = [
    { offset = 0, hex = "2321" },                                            # #!
]
# The viewer's text limit (`plugins.viewer_output_limit_mib`, 256 MiB): the text of a larger
# file would be cut anyway.
max_size = 268435456

[viewer]
# Read coloured; a script has no structure worth a tree.
outputs = ["highlighted"]

# Nothing granted: the plugin reads the file it is handed and nothing else.
[capabilities]

[metadata]
description = "Shows Python scripts and type stubs (.py, .pyw, .pyi) coloured like an editor."

# The host's 64 MiB of memory hold the index of at most 16 MiB (INDEX_BUDGET_BYTES in
# src/lib.rs), the 1 MiB windows `open` and `text` read and write through, and one line of at
# most 1 MiB with its text.
[limits]
# `open` reads the whole file once, which for a large file on a slow remote takes a while.
timeout_milliseconds = 60000

# How the file's bytes are read: `auto` takes the encoding of a byte-order mark (UTF-8, UTF-16),
# else UTF-8 when the start of the file is valid UTF-8 - Python 3's own default - else
# Windows-1252, for an old script saved in the ANSI code page.
[[settings]]
key = "encoding"
type = "choice"
values = ["auto", "utf-8", "utf-16le", "windows-1252"]
default = "auto"
