# rCommander's bundled XML viewer (RC-100-15). The fields every bundled plugin shares are in
# plugins/metadata.toml; `scripts/build-plugins.sh` writes them into the manifest it packages.
# A failure code starts with the plugin's id (locales/en.json).
plugin_type = "viewer"
# Contract 0.2.0: the viewer reads its setting `format` (RC-100-14).
api_version = "0.3.0"
id = "01a15939-9062-79b4-85e8-46e1ed70ad4f"
name = "XML viewer"
version = "0.1.2"

[match]
# Not `svg` (an image) or `html` (not XML, a case of its own).
extensions = [
    "xml", "xsd", "xsl", "xslt", "rss", "atom",
    "csproj", "vbproj", "vcxproj", "props", "targets", "nuspec", "resx", "xaml",
    "config", "manifest", "plist",
]
magic = []
# The viewer's text limit (`plugins.viewer_output_limit_mib`, 256 MiB): the text of a larger
# file would be cut anyway.
max_size = 268435456

[viewer]
# Read coloured, or unfold the elements; `highlighted` is shown first.
outputs = ["highlighted", "tree"]

# Nothing granted: the plugin reads the file it is handed and nothing else.
[capabilities]

[metadata]
description = "Shows XML coloured like an editor, or its elements as a tree to unfold."

# The host's 64 MiB of memory hold the index of at most 16 MiB (INDEX_BUDGET_BYTES in
# src/lib.rs) and the 1 MiB windows `open` and `text` read and write through; every byte read
# earns its fuel.
[limits]
# `open` reads the whole file once, which for a large file on a slow remote takes a while.
timeout_milliseconds = 60000

[[settings]]
key = "format"
type = "choice"
values = ["as_is", "pretty"]
default = "as_is"
