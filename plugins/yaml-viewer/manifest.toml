# rCommander's bundled YAML viewer (RC-100-16). The fields every bundled plugin shares are in
# plugins/metadata.toml; `scripts/build-plugins.sh` writes them into the manifest it packages.
# A failure code starts with the plugin's id (locales/en.json).
plugin_type = "viewer"
# Built against `rcommander:plugin@0.2.0` (RC-100-14). The plugin declares no `[[settings]]` and
# never calls the `settings` interface, so its component does not import it.
api_version = "0.3.0"
id = "01a15939-8404-762d-9569-7e4ec903238e"
name = "YAML viewer"
version = "0.1.2"

[match]
extensions = ["yaml", "yml"]
magic = []
# The viewer's text limit (`plugins.viewer_output_limit_mib`, 256 MiB): the text of a larger
# file would be cut anyway.
max_size = 268435456

[viewer]
# Read coloured, or unfold the structure; `highlighted` is shown first.
outputs = ["highlighted", "tree"]

# Nothing granted: the plugin reads the file it is handed and nothing else.
[capabilities]

[metadata]
description = "Shows YAML coloured like an editor, or as a tree to unfold."

# The host's 64 MiB of memory hold the index of at most 16 MiB (INDEX_BUDGET_BYTES in
# src/lib.rs) and the 1 MiB windows `open` and `text` read and write through.
[limits]
# `open` reads the whole file once, which for a large file on a slow remote takes a while.
timeout_milliseconds = 60000
