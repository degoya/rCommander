manifest_version = 1
plugin_type = "compare"
# The contract in `wit/` this plugin is built against; a compare plugin needs 0.6.0 or later.
api_version = "0.6.0"
# Your plugin's identity: `plugin new` generated it. Keep it across versions; two plugins
# sharing one would fight over the same installation folder.
id = "{{PLUGIN_ID}}"
name = "{{PLUGIN_NAME}}"
version = "0.1.0"
# `plugin new` generated this key pair; the private half is `plugin-signing.key`. Keep it out
# of version control, and name the key as you like.
key_id = "{{PLUGIN_SLUG}}-release-v1"
public_key = "REPLACE_WITH_YOUR_BASE64_ED25519_PUBLIC_KEY"

# The files this plugin compares, by extension or by name: rCommander offers it a pair when
# both files match. Their heads are not read, so a compare plugin claims no magic.
[match]
extensions = ["properties"]

[metadata]
description = "Compares two key=value files by key, whatever their order."
author = "Your name"
license = "MIT"
# The first rCommander release that accepts this plugin's `api_version`.
min_app_version = "0.22.0"
