manifest_version = 1
plugin_type = "secrets"
# The contract in `wit/` this plugin is built against; a secret source needs 0.3.0 or later.
api_version = "0.3.0"
# Your plugin's identity: `plugin new` generated it. Keep it across versions; two plugins
# sharing one would fight over the same installation folder.
id = "{{PLUGIN_ID}}"
name = "{{PLUGIN_NAME}}"
version = "0.1.0"
# `plugin new` generated this key pair; the private half is `plugin-signing.key`. Keep it out
# of version control, and name the key as you like.
key_id = "{{PLUGIN_SLUG}}-release-v1"
public_key = "REPLACE_WITH_YOUR_BASE64_ED25519_PUBLIC_KEY"

# A secret source reaches its manager's local bridge on this one port of this machine, plain
# HTTP, and nothing else. The install preview shows the port; installing is the person's
# confirmation, and an update that moves it asks again.
[capabilities]
net_http = { loopback = 8087 }

[metadata]
description = "Takes a connection's password from a password manager's local bridge."
author = "Your name"
license = "MIT"
# The first rCommander release that accepts this plugin's `api_version`.
min_app_version = "0.10.0"
